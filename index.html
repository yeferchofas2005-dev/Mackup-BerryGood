<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#351044">
    <meta name="description" content="BerryGood está preparando algo delicioso para ti.">
    <title>BerryGood | Preparando tu experiencia</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <main class="loading-screen" aria-labelledby="loading-title">
        <div class="loading-content">
            <div class="berry-art" role="img" aria-label="Una berry morada con una sonrisa">
                <span class="berry-leaf berry-leaf-left"></span>
                <span class="berry-leaf berry-leaf-center"></span>
                <span class="berry-leaf berry-leaf-right"></span>
                <span class="berry-body"></span>
                <span class="berry-eye berry-eye-left"></span>
                <span class="berry-eye berry-eye-right"></span>
                <span class="berry-smile"></span>
            </div>

            <p class="brand-name">Berry<span>Good</span></p>
            <h1 id="loading-title">Algo bueno está creciendo.</h1>
            <p class="loading-message">Estamos preparando tu experiencia</p>

            <div class="progress-track" role="progressbar" aria-label="Carga de BerryGood" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span class="progress-fill"></span>
            </div>
            <p class="progress-label" aria-live="polite"><span class="progress-value">0</span><span aria-hidden="true">%</span></p>
        </div>
        <p class="loading-footer">Hecho con un poquito de magia natural</p>
    </main>
</body>
</html>
